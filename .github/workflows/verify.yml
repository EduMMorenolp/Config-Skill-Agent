name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Suite estructural (skills + agentes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: npm test (estructura, contenido y sincronización)
        run: npm test
      - name: El ecosistema descubre las skills
        run: npx --yes skills add . -l
