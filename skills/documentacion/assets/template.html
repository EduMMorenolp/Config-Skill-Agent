<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}} — Documento de presentación</title>
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f8f9fb;
  --ink: #1c2733;
  --ink-soft: #55627a;
  --line: #dfe4ec;
  --brand-base: {{BRAND}};
  --brand: var(--brand-base);
  --brand-soft: color-mix(in srgb, var(--brand-base) 10%, #fff);
  --ok: #1e7a46;
  --ok-soft: #e4f3ea;
  --warn: #9a6206;
  --warn-soft: #faf0dc;
  --stop: #97312f;
  --stop-soft: #f8e6e5;
}
[data-theme="dark"] {
  --bg: #10151c;
  --surface: #171e28;
  --surface-2: #1d2632;
  --ink: #e7ecf4;
  --ink-soft: #9aa7bd;
  --line: #2a3546;
  --brand: color-mix(in srgb, var(--brand-base) 40%, #a9c4e4);
  --brand-soft: color-mix(in srgb, var(--brand-base) 22%, #10151c);
  --ok: #58c48b;
  --ok-soft: #14301f;
  --warn: #e0b45a;
  --warn-soft: #33280f;
  --stop: #e08a86;
  --stop-soft: #38191a;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.6 "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
.wrap { max-width: 920px; margin: 0 auto; padding: 0 28px 72px; }
.theme-toggle {
  position: fixed; top: 18px; right: 18px; z-index: 10;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 999px; padding: 8px 16px; font-size: 14px; cursor: pointer;
}
.theme-toggle:hover { border-color: var(--brand); }
.cover {
  background: linear-gradient(160deg, var(--brand) 0%, #2f5480 100%);
  color: #fff; border-radius: 0 0 18px 18px; padding: 72px 28px 56px; margin-bottom: 40px;
}
[data-theme="dark"] .cover { background: linear-gradient(160deg, #1c3050 0%, #16202e 100%); }
.cover .inner { max-width: 920px; margin: 0 auto; }
.cover .eyebrow { text-transform: uppercase; letter-spacing: .14em; font-size: 13px; opacity: .85; margin: 0 0 12px; }
.cover h1 { font-size: 44px; line-height: 1.15; margin: 0 0 18px; font-weight: 700; }
.cover .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
.badge {
  background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.3);
  border-radius: 999px; padding: 6px 14px; font-size: 14px;
}
.badge b { font-weight: 600; }
nav.toc {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 24px; margin-bottom: 40px;
}
nav.toc h2 { font-size: 15px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-soft); margin: 0 0 10px; }
nav.toc ol { margin: 0; padding-left: 20px; }
nav.toc a { color: var(--brand); text-decoration: none; }
nav.toc a:hover { text-decoration: underline; }
section.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 30px 34px; margin-bottom: 28px;
}
section.card h2 {
  margin: 0 0 18px; font-size: 24px; color: var(--brand);
  border-bottom: 2px solid var(--line); padding-bottom: 12px;
}
.objective {
  background: var(--brand-soft); border-left: 4px solid var(--brand);
  border-radius: 0 8px 8px 0; padding: 14px 18px; font-size: 17px; margin: 0;
}
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
@media (max-width: 720px) { .cols { grid-template-columns: 1fr; } .cover h1 { font-size: 32px; } }
.list-in, .list-out, .list-pending { list-style: none; margin: 0; padding: 0; }
.list-in li, .list-out li, .list-pending li {
  padding: 9px 12px 9px 34px; border-radius: 8px; margin-bottom: 8px; position: relative;
}
.list-in li { background: var(--ok-soft); }
.list-in li::before { content: "✓"; position: absolute; left: 12px; color: var(--ok); font-weight: 700; }
.list-out li { background: var(--stop-soft); }
.list-out li::before { content: "✕"; position: absolute; left: 12px; color: var(--stop); font-weight: 700; }
.list-pending li { background: var(--warn-soft); }
.list-pending li::before { content: "?"; position: absolute; left: 13px; color: var(--warn); font-weight: 700; }
.subhead { font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-soft); margin: 0 0 12px; }
ol.flow { list-style: none; counter-reset: step; margin: 0; padding: 0; }
ol.flow li {
  counter-increment: step; position: relative; padding: 12px 16px 12px 58px;
  border-radius: 8px; background: var(--surface-2); margin-bottom: 10px;
}
ol.flow li::before {
  content: counter(step); position: absolute; left: 14px; top: 12px;
  width: 28px; height: 28px; border-radius: 50%; background: var(--brand); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
}
ol.flow li b { display: block; margin-bottom: 2px; }
.story {
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 12px;
}
.story .sid {
  display: inline-block; background: var(--brand); color: #fff; border-radius: 6px;
  font-size: 12px; font-weight: 700; padding: 2px 8px; margin-bottom: 8px;
}
.story p { margin: 4px 0; }
.story em { color: var(--ink-soft); }
table.data { width: 100%; border-collapse: collapse; font-size: 15px; }
table.data th, table.data td { text-align: left; border-bottom: 1px solid var(--line); padding: 9px 10px; }
table.data th { color: var(--ink-soft); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
code.method { background: var(--brand-soft); color: var(--brand); border-radius: 5px; padding: 2px 7px; font-size: 13px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
.chip { background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 5px 13px; font-size: 14px; }
ul.notes { margin: 0; padding-left: 20px; }
ul.notes li { margin-bottom: 8px; }
footer.doc {
  margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line);
  color: var(--ink-soft); font-size: 13px; text-align: center;
}
@media print {
  :root, [data-theme="dark"] {
    --bg: #fff; --surface: #fff; --surface-2: #f6f7f9; --ink: #111; --ink-soft: #555;
    --line: #ccc; --brand: var(--brand-base); --brand-soft: color-mix(in srgb, var(--brand-base) 10%, #fff);
    --ok-soft: #e4f3ea; --warn-soft: #faf0dc; --stop-soft: #f8e6e5;
  }
  @page { size: A4; margin: 16mm; }
  body { background: #fff; }
  .theme-toggle { display: none; }
  .cover { border-radius: 0; }
  section.card, ol.flow li, .story { break-inside: avoid; }
  nav.toc { break-after: page; }
}
</style>
</head>
<body>
<button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar tema">◐ Tema</button>
<header class="cover">
  <div class="inner">
    <p class="eyebrow">Documento de presentación de feature</p>
    <h1>{{TITLE}}</h1>
    <div class="badges">
      <span class="badge"><b>Servicio:</b> {{SERVICE}}</span>
      <span class="badge"><b>Rol:</b> {{ROLE}}</span>
      <span class="badge"><b>Estado:</b> {{STATUS}}</span>
      <span class="badge"><b>Versión:</b> {{VERSION}}</span>
      <span class="badge"><b>Fecha:</b> {{DATE}}</span>
      {{AUTHOR_BADGE}}
    </div>
  </div>
</header>
<div class="wrap">
  {{TOC}}
  {{SECTIONS}}
  <footer class="doc">Generado con la skill <b>documentacion</b> · {{DATE}} · para imprimir a PDF: Ctrl+P → Guardar como PDF</footer>
</div>
<script>
(function () {
  var btn = document.getElementById('themeToggle');
  var root = document.documentElement;
  var saved = null;
  try { saved = localStorage.getItem('doc-theme'); } catch (e) {}
  if (saved) { root.setAttribute('data-theme', saved); }
  btn.addEventListener('click', function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('doc-theme', next); } catch (e) {}
  });
})();
</script>
</body>
</html>
