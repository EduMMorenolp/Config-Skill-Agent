<!doctype html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#f7f8fa;--panel:#ffffff;--ink:#1b1f24;--muted:#5b6570;--line:#e3e6ea;--accent:#1f6feb;--code:#f2f4f7;--meta:#eef3fb}
[data-theme="dark"]{--bg:#0f1216;--panel:#161b22;--ink:#e6edf3;--muted:#9aa4af;--line:#2b333c;--accent:#4c8dff;--code:#1b222b;--meta:#182130}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.topbar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.topbar strong{font-size:15px}
.topbar .spacer{flex:1}
.topbar input{flex:0 1 280px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:14px}
.topbar button{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;font-size:14px}
.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;align-items:start}
.sidebar{position:sticky;top:53px;max-height:calc(100vh - 53px);overflow:auto;padding:16px;border-right:1px solid var(--line);background:var(--panel)}
.sidebar .phase{margin:14px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sidebar a{display:block;padding:6px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:14px}
.sidebar a:hover{background:var(--code);color:var(--accent)}
.sidebar a.active{background:var(--meta);color:var(--accent);font-weight:600}
.content{padding:28px 32px 80px;max-width:980px}
.content h1{margin:8px 0 6px;font-size:28px;border-bottom:2px solid var(--line);padding-bottom:8px}
.content h2{margin:26px 0 8px;font-size:21px}
.content h3{margin:20px 0 6px;font-size:17px}
.doc{padding-top:22px;margin-top:22px;border-top:1px solid var(--line)}
.doc:first-child{border-top:0;margin-top:0}
.metabox{margin:10px 0;padding:10px 12px;background:var(--meta);border-left:3px solid var(--accent);border-radius:6px;font-size:13px;color:var(--muted)}
table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
th{background:var(--code)}
code{background:var(--code);padding:1px 5px;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto}
pre code{background:none;padding:0}
.caption{margin:-6px 0 14px;font-size:12px;color:var(--muted);font-style:italic}
ul,ol{margin:8px 0;padding-left:24px}
.foot{padding:14px 32px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.badge{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted)}
@media (max-width:820px){.layout{grid-template-columns:1fr}.sidebar{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.content{padding:20px 16px 60px}}
@media print{.topbar,.sidebar,.foot{display:none}.layout{display:block}.content{max-width:none;padding:0}.doc{page-break-before:always}}
</style>
</head>
<body>
<header class="topbar">
  <strong>__TITLE__</strong>
  <span class="badge">visor de documentacion</span>
  <span class="spacer"></span>
  <input id="q" type="search" placeholder="Buscar documento" aria-label="Buscar documento">
  <button id="theme" type="button" aria-label="Cambiar tema claro u oscuro">Tema</button>
</header>
<div class="layout">
  <nav class="sidebar" id="nav" aria-label="Documentos del proyecto">__SIDEBAR__</nav>
  <main class="content" id="content">__CONTENT__</main>
</div>
<footer class="foot">__GENERATED__ · Sin recursos externos: abri este archivo o corre <code>serve.mjs</code> para verlo en el navegador</footer>
<script>
(function(){
  var root=document.documentElement;
  var saved=null;try{saved=localStorage.getItem('pmdocs-theme')}catch(e){}
  if(saved){root.setAttribute('data-theme',saved)}
  document.getElementById('theme').addEventListener('click',function(){
    var next=root.getAttribute('data-theme')==='dark'?'light':'dark';
    root.setAttribute('data-theme',next);
    try{localStorage.setItem('pmdocs-theme',next)}catch(e){}
  });
  var q=document.getElementById('q');
  q.addEventListener('input',function(){
    var term=q.value.trim().toLowerCase();
    var items=document.querySelectorAll('#nav a');
    for(var i=0;i<items.length;i++){
      var hit=items[i].textContent.toLowerCase().indexOf(term)!==-1;
      items[i].style.display=hit?'':'none';
    }
  });
  var links=[].slice.call(document.querySelectorAll('#nav a'));
  if('IntersectionObserver' in window){
    var obs=new IntersectionObserver(function(entries){
      entries.forEach(function(e){
        if(!e.isIntersecting)return;
        links.forEach(function(a){a.classList.remove('active')});
        var active=document.querySelector('#nav a[href="#'+e.target.id+'"]');
        if(active)active.classList.add('active');
      });
    },{rootMargin:'-60px 0px -70% 0px'});
    document.querySelectorAll('.doc').forEach(function(s){obs.observe(s)});
  }
})();
</script>
</body>
</html>
